parameters:
  - name: displayName
    type: string
  - name: functionName
    type: string
  - name: zipFileName
    type: string
  - name: schemaFilePath
    type: string
  - name: appSyncApiId
    type: string

steps:
  - script: |
      set -euo pipefail
      aws lambda update-function-code \
        --function-name ${{ parameters.functionName }} \
        --zip-file fileb://${{ parameters.zipFileName }}
      aws lambda wait function-updated \
        --function-name ${{ parameters.functionName }}
      echo "${{ parameters.displayName }} update completed."
    displayName: 'Update ${{ parameters.displayName }} Code'
    env:
      AWS_REGION: $(AWS_REGION)
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

  - script: |
      set -euo pipefail
      NEW_VERSION=$(aws lambda publish-version \
        --function-name ${{ parameters.functionName }} \
        --query 'Version' \
        --output text)
      echo "Published lambda version: $NEW_VERSION"
      aws lambda update-alias \
        --function-name ${{ parameters.functionName }} \
        --name $(LAMBDA_ALIAS_NAME) \
        --function-version $NEW_VERSION
      echo "Updated alias $(LAMBDA_ALIAS_NAME) to version $NEW_VERSION"
    displayName: 'Update ${{ parameters.displayName }} Version and Alias'
    env:
      AWS_REGION: $(AWS_REGION)
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

  - script: |
      set -euo pipefail

      if [[ ! -f "${{ parameters.schemaFilePath }}" ]]; then
        echo "AppSync schema file not found: ${{ parameters.schemaFilePath }}" >&2
        exit 1
      fi

      echo "Deploying AppSync schema from ${{ parameters.schemaFilePath }}..."
      aws appsync start-schema-creation \
        --api-id ${{ parameters.appSyncApiId }} \
        --definition fileb://${{ parameters.schemaFilePath }} \
        --output json >/dev/null

      for ATTEMPT in $(seq 1 10); do
        SCHEMA_STATUS=$(aws appsync get-schema-creation-status \
          --api-id ${{ parameters.appSyncApiId }} \
          --query 'status' \
          --output text)

        if [[ "$SCHEMA_STATUS" == "SUCCESS" || "$SCHEMA_STATUS" == "ACTIVE" ]]; then
          echo "AppSync schema deployment completed with status: $SCHEMA_STATUS"
          break
        fi

        if [[ "$SCHEMA_STATUS" == "FAILED" ]]; then
          aws appsync get-schema-creation-status \
            --api-id ${{ parameters.appSyncApiId }} \
            --query 'details' \
            --output text
          exit 1
        fi

        if [[ "$ATTEMPT" -eq 10 ]]; then
          echo "Timed out waiting for AppSync schema deployment. Last status: $SCHEMA_STATUS"
          exit 1
        fi

        echo "AppSync schema deployment status: $SCHEMA_STATUS. Waiting 5 seconds..."
        sleep 5
      done

      echo "AppSync schema deployed successfully."
    displayName: 'Deploy AppSync Schema'
    env:
      AWS_REGION: $(AWS_REGION)
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

  - script: |
      set -euo pipefail
      VERSIONS_TO_DELETE=$(aws lambda list-versions-by-function \
        --function-name ${{ parameters.functionName }} \
        --query 'reverse(sort_by(Versions[?Version != `$LATEST`], &to_number(Version)))[$(KEEP_LAMBDA_VERSIONS):].Version' \
        --output text)

      if [[ -z "$VERSIONS_TO_DELETE" || "$VERSIONS_TO_DELETE" == "None" ]]; then
        echo "No old versions to delete for ${{ parameters.displayName }}."
        exit 0
      fi

      for VERSION in $VERSIONS_TO_DELETE; do
        echo "Deleting version $VERSION..."
        aws lambda delete-function \
          --function-name ${{ parameters.functionName }} \
          --qualifier "$VERSION"
      done
    continueOnError: true
    displayName: 'Delete Old ${{ parameters.displayName }} Versions'
    env:
      AWS_REGION: $(AWS_REGION)
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
