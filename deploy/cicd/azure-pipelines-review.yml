# azure-pipelines-review.yml
# Triggers on every PR targeting develop

name: 'LambdaAPI Review'

trigger: none # Triggered by Branch Policy on 'develop', not by a push/pr trigger

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Variables are sourced from Variable Group: AI-pull-request-variables
  - group: AI-pull-request-variables

jobs:
  - job: CopilotReview
    displayName: 'AI Code Review'
    steps:
      # Step 1: Checkout with full git history for git diff
      - checkout: self
        fetchDepth: 0
        persistCredentials: true

      # Step 2: Set up Node.js
      - task: UseNode@1
        inputs:
          version: '22.x'
        displayName: 'Install Node.js'

      # Step 3: Install GitHub Copilot CLI
      - script: npm install -g @github/copilot
        displayName: 'Install Copilot CLI'

      # Step 4: Configure Azure DevOps MCP Server
      - script: |
          ADO_ORG=$(echo "$SYSTEM_COLLECTIONURI" | sed 's|https://dev.azure.com/||;s|/||')
          mkdir -p ~/.copilot
          cat > ~/.copilot/mcp-config.json << EOF
          {
            "mcpServers": {
              "mcp_azure": {
                "type": "stdio",
                "command": "npx",
                "args": ["-y", "@azure-devops/mcp", "$ADO_ORG", "--authentication", "envvar"],
                "tools": [
                  "repo_get_pull_request_by_id",
                  "repo_get_pull_request_changes",
                  "repo_list_pull_request_threads",
                  "repo_create_pull_request_thread"
                ]
              }
            }
          }
          EOF
        displayName: 'Configure ADO MCP'
        env:
          SYSTEM_COLLECTIONURI: $(System.CollectionUri)

      # Step 5: Run Copilot PR Review
      - script: |
          set -euo pipefail

          # Fallback to 10 when the variable-group value is empty.
          REVIEW_MAX_ISSUES="${REVIEW_MAX_ISSUES:-10}"
          export REVIEW_MAX_ISSUES="$REVIEW_MAX_ISSUES"

          echo "COPILOT_MODEL=$COPILOT_MODEL"
          echo "REVIEW_MAX_ISSUES=$REVIEW_MAX_ISSUES"
          echo "SYSTEM_PULLREQUEST_PULLREQUESTID=$SYSTEM_PULLREQUEST_PULLREQUESTID"
          if [ -z "$SYSTEM_PULLREQUEST_PULLREQUESTID" ]; then
            echo "##[warning]SYSTEM_PULLREQUEST_PULLREQUESTID is empty — not a PR build. Skipping review."
            exit 0
          fi

          if [ -z "${COPILOT_GITHUB_TOKENS}" ]; then
            echo "##[error]COPILOT_GITHUB_TOKENS is not configured. Set the pipeline variable."
            exit 1
          fi
          IFS=',' read -ra TOKENS <<< "${COPILOT_GITHUB_TOKENS}"
          echo "Loaded ${#TOKENS[@]} GitHub tokens for Copilot review."
          SUCCESS=0
          for TOKEN in "${TOKENS[@]}"; do
            export COPILOT_GITHUB_TOKEN="$TOKEN"
            echo "Running Copilot review with token: ${TOKEN:0:10}... (truncated)"
            set +e
            copilot --model "$COPILOT_MODEL" --allow-all --prompt "/yr-pr-review $SYSTEM_PULLREQUEST_PULLREQUESTID --context \"CI mode: AI_REVIEW_AUTO_PUSH=true. Auto-push comments without asking confirmation. Max comments from REVIEW_MAX_ISSUES.\""
            COPILOT_STATUS=$?
            set -e
            echo "Copilot CLI exit code: $COPILOT_STATUS"
            if [ "$COPILOT_STATUS" -ne 0 ]; then
              echo "Copilot CLI failed (exit code $COPILOT_STATUS), trying next token..."
              continue
            fi
            SUCCESS=1
            break
          done
          if [ "$SUCCESS" -eq 0 ]; then
            echo "All tokens are invalid or quota exceeded."
            exit 1
          fi
        displayName: 'Copilot PR Review'
        env:
          COPILOT_GITHUB_TOKENS: $(COPILOT_GITHUB_TOKENS)
          COPILOT_MODEL: $(COPILOT_MODEL)
          REVIEW_MAX_ISSUES: $(REVIEW_MAX_ISSUES)
          ADO_MCP_AUTH_TOKEN: $(System.AccessToken)
          SYSTEM_PULLREQUEST_PULLREQUESTID: $(System.PullRequest.PullRequestId)
