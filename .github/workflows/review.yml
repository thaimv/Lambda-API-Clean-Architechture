name: LambdaAPIs Review

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    if: ${{ vars.COPILOT_REVIEW_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-review-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run Copilot review
        shell: bash
        run: |
          set -euo pipefail

          REVIEW_MAX_ISSUES="${REVIEW_MAX_ISSUES:-10}"
          export REVIEW_MAX_ISSUES="$REVIEW_MAX_ISSUES"

          PR_NUMBER="${{ github.event.pull_request.number || '' }}"
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No pull request number found. Skipping review."
            exit 0
          fi

          echo "COPILOT_MODEL=${COPILOT_MODEL:-gpt-5}"
          echo "REVIEW_MAX_ISSUES=$REVIEW_MAX_ISSUES"
          echo "PR_NUMBER=$PR_NUMBER"

          TOKENS_RAW="${COPILOT_GITHUB_TOKENS:-}"

          if [[ -z "$TOKENS_RAW" ]]; then
            echo "COPILOT_GITHUB_TOKENS is not configured."
            exit 1
          fi

          IFS=',' read -ra TOKENS <<< "$TOKENS_RAW"
          echo "Loaded ${#TOKENS[@]} token(s) for Copilot review."

          SUCCESS=0
          for TOKEN in "${TOKENS[@]}"; do
            TOKEN_TRIMMED="$(echo "$TOKEN" | xargs)"
            if [[ -z "$TOKEN_TRIMMED" ]]; then
              continue
            fi

            export COPILOT_GITHUB_TOKEN="$TOKEN_TRIMMED"
            echo "Running Copilot review with token: ${TOKEN_TRIMMED:0:10}... (truncated)"

            set +e
            copilot \
              --model "${COPILOT_MODEL:-gpt-5}" \
              --allow-all \
              --prompt "/review #${PR_NUMBER} --context \"CI mode: auto-push comments. Max comments from REVIEW_MAX_ISSUES.\""
            COPILOT_STATUS=$?
            set -e

            echo "Copilot CLI exit code: $COPILOT_STATUS"
            if [[ "$COPILOT_STATUS" -ne 0 ]]; then
              echo "Copilot CLI failed, trying next token..."
              continue
            fi

            SUCCESS=1
            break
          done

          if [[ "$SUCCESS" -eq 0 ]]; then
            echo "All tokens failed or exceeded quota."
            exit 1
          fi
        env:
          COPILOT_GITHUB_TOKENS: ${{ secrets.COPILOT_GITHUB_TOKENS }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}
          REVIEW_MAX_ISSUES: ${{ vars.REVIEW_MAX_ISSUES }}
