# ===== Version: v0.0.1 ======

input UserInfoInput {
  userNickname: String!
}

type UserInfoResponse {
  cognitoSub: String!
  userNickname: String!
  cognitoId: String
}

schema {
  query: Query
  mutation: Mutation
}

# ======= Query =========
type Query {
  _empty: String
}

# ======= Mutation =========
type Mutation {
  createUserInfo(input: UserInfoInput): UserInfoResponse
}
